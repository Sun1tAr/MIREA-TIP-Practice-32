apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tip-practice-32
data:
  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USER: "tasks_user"
  DB_NAME: "tasks_db"
  DB_DRIVER: "postgres"

  # Redis
  REDIS_ADDR: "redis-service:6379"
  REDIS_DB: "0"
  CACHE_TTL_SECONDS: "120"
  CACHE_TTL_JITTER_SECONDS: "30"

  # RabbitMQ очереди (для worker)
  MAIN_QUEUE: "task_jobs"
  RETRY_QUEUE: "task_jobs_retry"
  DLQ: "task_jobs_dlq"
  RABBITMQ_PREFETCH: "1"
  MAX_ATTEMPTS: "3"
  RETRY_DELAY_SECONDS: "10"

  # Сервисы
  AUTH_HTTP_PORT: "8081"
  AUTH_GRPC_PORT: "50051"
  TASKS_PORT: "8082"
  GRAPHQL_PORT: "8090"
  LOG_LEVEL: "info"

  # Для tasks
  RABBITMQ_QUEUE: "task_events"
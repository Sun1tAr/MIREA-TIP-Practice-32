apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tip-practice-32
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tip-practice-32
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: auth
          image: ghcr.io/sun1tar/mirea-tip-practice-32/auth:health-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: AUTH_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_HTTP_PORT
            - name: AUTH_GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_GRPC_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
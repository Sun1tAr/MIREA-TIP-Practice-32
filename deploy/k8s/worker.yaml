apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tip-practice-32
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/sun1tar/mirea-tip-practice-32/worker:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
            - name: MAIN_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MAIN_QUEUE
            - name: RETRY_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RETRY_QUEUE
            - name: DLQ
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ
            - name: RABBITMQ_PREFETCH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RABBITMQ_PREFETCH
            - name: MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MAX_ATTEMPTS
            - name: RETRY_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RETRY_DELAY_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
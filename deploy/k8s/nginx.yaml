apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tip-practice-32-ingress
  namespace: tip-practice-32
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: denchik23761.fvds.ru
      http:
        paths:
          # Auth endpoints
          - path: /MIREA/TIP-Practice/32/auth-service(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081

          # Tasks API endpoints
          - path: /MIREA/TIP-Practice/32/tasks-service(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tasks-service
                port:
                  number: 8082

          # GraphQL endpoints
          - path: /MIREA/TIP-Practice/32/graphql-service(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: graphql-service
                port:
                  number: 8090

          # Health endpoints для всех сервисов
          - path: /MIREA/TIP-Practice/32/health-checks(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tasks-service
                port:
                  number: 8082